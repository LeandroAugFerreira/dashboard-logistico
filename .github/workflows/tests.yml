name: Integridade e cálculos
on: [push, pull_request]
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node --test tests/*.test.mjs
      - name: Analisar cobertura de chaves sem expor linhas de dados
        run: node scripts/recruitment_audit.mjs
      - name: Arquivar diagnóstico agregado de integridade
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logistica-integridade-agregada
          path: reports/quality-summary.json
          if-no-files-found: ignore
          retention-days: 7
